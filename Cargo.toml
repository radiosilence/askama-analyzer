[workspace]
members = ["crates/*"]
# askama's test suite, read by the corpus tests; not a member.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/askama-analyzer"
publish = false

[workspace.dependencies]
askama-analyzer-codegen = { path = "crates/askama-analyzer-codegen" }
# askama's generator with the `tooling` feature, from the `tooling` branch of
# radiosilence/askama: askama's release (0.16.1) plus that one change. The
# parser comes from the same commit, since askama_derive requires its own.
askama_parser = { git = "https://github.com/radiosilence/askama", rev = "ee3b7effc0eebf3ab3f78f2dad7d0d5b00d482ed", default-features = false, features = ["config"] }
askama_derive = { git = "https://github.com/radiosilence/askama", rev = "ee3b7effc0eebf3ab3f78f2dad7d0d5b00d482ed", default-features = false, features = [
    "alloc",
    "code-in-doc",
    "config",
    "external-sources",
    "serde_json",
    "std",
    "tooling",
    "urlencode",
] }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing", "visit", "clone-impls"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
